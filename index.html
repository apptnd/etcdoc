function parseDate(v){const s=String(v||'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d;}
function thaiDate(v){const d=parseDate(v);return d?`${d.getDate()} ${THAI_M[d.getMonth()]} ${d.getFullYear()+543}`:'—';}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dtLoc(v){const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});}

function openModal(title,bodyHTML,wide){const w=wide?'max-w-3xl':'max-w-2xl';$('#modal-root').innerHTML=`<div class="bg-white rounded-xl shadow-2xl w-full ${w} max-h-[92vh] overflow-y-auto"><div class="flex items-center justify-between p-4 border-b sticky top-0 bg-white z-10"><h3 class="font-bold text-slate-800">${title}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button></div><div class="p-5">${bodyHTML}</div></div>`;$('#modal-root').classList.remove('hidden');}
function closeModal(){$('#modal-root').classList.add('hidden');$('#modal-root').innerHTML='';}
 $('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-root')closeModal();});
function confirmBox(msg){return new Promise(res=>{openModal('ยืนยันการดำเนินการ',`<p class="text-slate-600">${msg}</p><div class="flex gap-2 justify-end mt-5"><button id="cf-no" class="${BTN_G}">ยกเลิก</button><button id="cf-yes" class="px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700">ยืนยัน</button></div>`);$('#cf-yes').onclick=()=>{closeModal();res(true)};$('#cf-no').onclick=()=>{closeModal();res(false)};});}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime||'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}

/* ================= API ================= */
async function api(action,data={}){
  if(DEMO)return demoApi(action,data);
  try{
    const res=await fetch(APP_CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...data,action,token:S.token})});
    const out=await res.json();
    if(out&&out.success===false&&/เซสชัน|ไม่พบผู้ใช้/.test(out.message||''))forceLogout();
    return out;
  }catch(err){return {success:false,message:'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: '+err.message};}
}
function forceLogout(){localStorage.removeItem('edoc_token');localStorage.removeItem('edoc_demo_email');location.reload();}

function demoDB(){
  let db=null; try{db=JSON.parse(localStorage.getItem('edoc_demo_db')||'null')}catch(e){}
  if(!db){db={users:DEMO_SEED.users.map(u=>({...u})),tpls:DEMO_SEED.tpls.map(t=>({...t})),cats:DEMO_SEED.cats.map(c=>({...c})),docs:DEMO_SEED.docs.map(d=>({...d})),logs:[]};localStorage.setItem('edoc_demo_db',JSON.stringify(db));}
  if(!db.tpls)db.tpls=DEMO_SEED.tpls.map(t=>({...t}));
  db.docs.forEach(d=>{if(!Array.isArray(d.images))d.images=[];if(d.closing===undefined)d.closing='';});
  return db;
}
function saveDB(db){localStorage.setItem('edoc_demo_db',JSON.stringify(db));}
function demoUser(db){const e=localStorage.getItem('edoc_demo_email');return e?db.users.find(u=>u.email===e):null;}
function pubU(u){const{pass,...rest}=u;return rest;}
function demoFiles(){try{return JSON.parse(localStorage.getItem('edoc_demo_files')||'{}')}catch(e){return{}}}
function demoNextNumber(db,type){
  const y=String(new Date().getFullYear()+543);let max=0;
  db.docs.forEach(d=>{const m=String(d.number||'').match(/(\d{4})\s*\/\s*(\d{4})\s*$/);if(m&&m[2]===y)max=Math.max(max,parseInt(m[1],10));});
  const seq=String(max+1).padStart(4,'0');
  return type==='internal'?APP_CONFIG.DOC_PREFIX+'/'+seq+'/'+y:(type==='incoming'?'รับ ':'ส่ง ')+seq+'/'+y;
}
async function demoApi(action,data){
  await sleep(250);
  const db=demoDB();
  const dlog=(a,x)=>{db.logs.unshift({timestamp:new Date().toISOString(),email:(demoUser(db)||{}).email||'-',action:a,detail:x});db.logs=db.logs.slice(0,300);};
  switch(action){
    case 'ping':return{success:true};
    case 'login':{const email=String(data.email||'').trim().toLowerCase();const u=db.users.find(x=>x.email===email);
      if(!u||u.pass!==data.password)return{success:false,message:'อีเมลหรือรหัสผ่านไม่ถูกต้อง (โหมดตัวอย่าง: admin@msu.ac.th / Admin@123)'};
      if(u.status!=='active')return{success:false,message:'บัญชีนี้ถูกระงับการใช้งาน'};
      u.lastLogin=new Date().toISOString();localStorage.setItem('edoc_demo_email',email);dlog('login','เข้าสู่ระบบสำเร็จ');saveDB(db);
      return{success:true,token:'demo-'+Math.random().toString(36).slice(2),user:pubU(u)};}
    case 'logout':localStorage.removeItem('edoc_demo_email');return{success:true};
    case 'me':{const u=demoUser(db);return u?{success:true,user:pubU(u)}:{success:false,message:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'};}
    case 'changePassword':{const u=demoUser(db);if(!u)return{success:false,message:'เซสชันหมดอายุ'};
      if(u.pass!==data.oldPassword)return{success:false,message:'รหัสผ่านเดิมไม่ถูกต้อง'};
      if(!data.newPassword||String(data.newPassword).length<6)return{success:false,message:'รหัสผ่านใหม่ต้องยาวอย่างน้อย 6 ตัวอักษร'};
      u.pass=String(data.newPassword);dlog('changePassword','เปลี่ยนรหัสผ่าน');saveDB(db);return{success:true,message:'เปลี่ยนรหัสผ่านสำเร็จ'};}
    case 'documents.list':return{success:true,docs:db.docs.filter(d=>d.status!=='deleted')};
    case 'documents.save':{const d=data.doc||{};const num=String(d.number||'').trim()||demoNextNumber(db,d.type);
      if(d.id){const i=db.docs.findIndex(x=>x.id===d.id);if(i<0)return{success:false,message:'ไม่พบเอกสารนี้'};
        db.docs[i]={...db.docs[i],...d,number:num,images:parseImgs(d.images),closing:String(d.closing||''),updatedAt:new Date().toISOString()};dlog('documents.update',d.id+' | '+d.title);saveDB(db);return{success:true,id:d.id,number:num};}
      const id='D'+String(db.docs.length+1).padStart(5,'0'),now=new Date().toISOString();
      db.docs.push({id,number:num,refNumber:String(d.refNumber||''),type:d.type,title:d.title,date:d.date,categoryId:d.categoryId||'',
        fromParty:d.fromParty||'',toParty:d.toParty||'',urgency:d.urgency||'ปกติ',classification:d.classification||'ปกติ',content:d.content||'',
        signer:d.signer||'',signerPosition:d.signerPosition||'',fileId:d.fileId||'',fileName:d.fileName||'',fileUrl:d.fileUrl||'',
        status:'active',createdBy:(demoUser(db)||{}).email||'-',createdAt:now,updatedAt:now,remark:d.remark||'',
        templateId:d.templateId||'',images:parseImgs(d.images),closing:String(d.closing||'')});
      dlog('documents.create',id+' | '+d.title);saveDB(db);return{success:true,id,number:num};}
    case 'documents.delete':{const i=db.docs.findIndex(x=>x.id===data.id);if(i<0)return{success:false,message:'ไม่พบเอกสารนี้'};
      db.docs[i].status='deleted';dlog('documents.delete',data.id);saveDB(db);return{success:true};}
    case 'categories.list':return{success:true,cats:db.cats.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)))};
    case 'categories.save':{const c=data.cat||{};
      if(c.id){const i=db.cats.findIndex(x=>x.id===c.id);if(i<0)return{success:false,message:'ไม่พบหมวดหมู่นี้'};
        db.cats[i]={...db.cats[i],code:c.code,name:c.name,description:c.description||'',active:!!c.active};}
      else db.cats.push({id:'C'+String(db.cats.length+1).padStart(2,'0'),code:c.code,name:c.name,description:c.description||'',active:!!c.active,sort:parseInt(c.code)||99});
      dlog('categories.save',c.code+' '+c.name);saveDB(db);return{success:true};}
    case 'categories.delete':{const i=db.cats.findIndex(x=>x.id===data.id);if(i<0)return{success:false,message:'ไม่พบหมวดหมู่นี้'};
      if(db.docs.some(d=>d.categoryId===data.id&&d.status!=='deleted'))return{success:false,message:'มีเอกสารใช้หมวดหมู่นี้อยู่ กรุณาปิดการใช้งานแทนการลบ'};
      db.cats.splice(i,1);dlog('categories.delete',data.id);saveDB(db);return{success:true};}
    case 'templates.list':return{success:true,tpls:db.tpls};
    case 'templates.save':{const t=data.tpl||{};
      if(t.id){const i=db.tpls.findIndex(x=>x.id===t.id);if(i<0)return{success:false,message:'ไม่พบแผ่นแบบนี้'};
        db.tpls[i]={...db.tpls[i],...t,logoWidthCm:parseFloat(t.logoWidthCm)||2.5};}
      else db.tpls.push({...t,id:'T'+String(db.tpls.length+1).padStart(2,'0'),logoWidthCm:parseFloat(t.logoWidthCm)||2.5});
      if(t.isDefault)db.tpls.forEach(x=>{if(x.id!==t.id)x.isDefault=false;});
      dlog('templates.save',t.name);saveDB(db);return{success:true};}
    case 'templates.delete':{const i=db.tpls.findIndex(x=>x.id===data.id);if(i<0)return{success:false,message:'ไม่พบแผ่นแบบนี้'};
      db.tpls.splice(i,1);dlog('templates.delete',data.id);saveDB(db);return{success:true};}
    case 'users.list':return{success:true,users:db.users.map(pubU)};
    case 'users.save':{const u=data.user||{};const email=String(u.email||'').trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return{success:false,message:'รูปแบบอีเมลไม่ถูกต้อง'};
      let perms=typeof u.permissions==='string'?u.permissions:JSON.stringify(u.permissions||{});
      if(u.id){const i=db.users.findIndex(x=>x.id===u.id);if(i<0)return{success:false,message:'ไม่พบผู้ใช้งานนี้'};
        if(db.users.some((x,j)=>j!==i&&x.email===email))return{success:false,message:'อีเมลนี้ถูกใช้งานโดยบัญชีอื่นแล้ว'};
        db.users[i]={...db.users[i],email,name:u.name||'',position:u.position||'',role:u.role==='admin'?'admin':'user',permissions:perms,status:u.status==='inactive'?'inactive':'active'};
        if(u.password)db.users[i].pass=String(u.password);}
      else{if(!u.password||String(u.password).length<6)return{success:false,message:'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'};
        if(db.users.some(x=>x.email===email))return{success:false,message:'อีเมลนี้ถูกใช้งานแล้ว'};
        db.users.push({id:'U'+String(db.users.length+1).padStart(4,'0'),email,pass:String(u.password),name:u.name||'',position:u.position||'',role:u.role==='admin'?'admin':'user',permissions:perms,status:u.status==='inactive'?'inactive':'active',lastLogin:''});}
      dlog('users.save',email);saveDB(db);return{success:true};}
    case 'users.delete':{const cur=demoUser(db);const i=db.users.findIndex(x=>x.id===data.id);if(i<0)return{success:false,message:'ไม่พบผู้ใช้งานนี้'};
      if(db.users[i].email===cur.email)return{success:false,message:'ไม่สามารถลบบัญชีของตัวเองได้'};
      db.users.splice(i,1);dlog('users.delete',data.id);saveDB(db);return{success:true};}
    case 'files.upload':{const fid='F'+Date.now();const files=demoFiles();
      const dataUrl='data:'+(data.mimeType||'image/png')+';base64,'+data.base64;
      files[fid]={name:data.fileName||'file',dataUrl};
      try{localStorage.setItem('edoc_demo_files',JSON.stringify(files));}catch(e){return{success:false,message:'พื้นที่จัดเก็บของโหมดตัวอย่างเต็ม (ลบข้อมูลจำลองแล้วลองใหม่ หรือใช้ภาพเล็กลง)'};}
      dlog('files.upload',data.fileName||'file');saveDB(db);
      return{success:true,file:{id:fid,name:data.fileName||'file',url:'#',imgUrl:dataUrl}};}
    case 'files.getBase64':{const f=demoFiles()[data.fileId];return f?{success:true,data:f.dataUrl}:{success:false,message:'ไม่พบไฟล์'};}
    case 'logs.list':return{success:true,logs:db.logs.slice(0,300)};
    default:return{success:false,message:'ไม่พบ action: '+action};
  }
}

 $('#login-form').addEventListener('submit',async e=>{

  else{errEl.textContent=(out&&out.message)||'เข้าสู่ระบบไม่สำเร็จ';errEl.classList.remove('hidden');}
});

  buildNav();
  const [dr,cr,tr]=await Promise.all([api('documents.list'),api('categories.list'),api('templates.list')]);

  const maxC=Math.max(1,...S.cats.map(ct=>list.filter(d=>d.categoryId===ct.id).length));

  const recent=[...list].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,8);
  return `<div class="flex flex-wrap items-center gap-3 mb-5">

  <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">${cards.map(c=>`<div class="${c[2]} text-white rounded-xl p-4"><div class="text-3xl font-bold">${c[1]}</div><div class="text-xs mt-1 opacity-80">${c[0]}</div></div>`).join('')}</div>
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border p-5"><h3 class="font-bold text-slate-800 mb-3">สถิติตามหมวดหมู่เอกสาร${m?' (เดือนที่เลือก)':''}</h3><div class="space-y-2">${bars||'<p class="text-sm text-slate-400">ไม่มีข้อมูล</p>'}</div></div>
    <div class="bg-white rounded-xl border p-5"><h3 class="font-bold text-slate-800 mb-3">เอกสารล่าสุด</h3><div class="divide-y text-sm">${recent.map(d=>`<div class="py-2 flex items-center gap-2 cursor-pointer hover:bg-slate-50 -mx-2 px-2 rounded" onclick="go('docview','${d.id}')"><div class="min-w-0 flex-1"><div class="truncate font-medium text-slate-700">${esc(d.title)}</div><div class="text-xs text-slate-400">${esc(d.number)} · ${thaiDate(d.date)}</div></div>${typeBadge(d.type)}</div>`).join('')||'<p class="text-slate-400 text-sm">ไม่มีข้อมูล</p>'}</div></div>

function exportCSV(){
  const m=S.dashMonth;
  const list=(m?S.docs.filter(d=>String(d.date||'').slice(0,7)===m):S.docs).filter(d=>d.status!=='deleted');
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const rows=[['เลขที่','วันที่','ประเภท','หมวดหมู่','เรื่อง','จาก','ถึง','ความเร็ว','ความลับ','คำลงท้าย','ผู้บันทึก'].map(q).join(',')]
    .concat(list.map(d=>[d.number,thaiDate(d.date),DOC_TYPES[d.type],catName(d.categoryId),d.title,d.fromParty,d.toParty,d.urgency,d.classification,d.closing,d.createdBy].map(q).join(',')));
  download('รายงานเอกสาร_'+(m||'ทั้งหมด')+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('ส่งออกรายงาน CSV แล้ว ('+list.length+' รายการ)');
}

/* ================= ทะเบียนเอกสาร ================= */
function filteredDocs(){
  const f=S.filters;
  return S.docs.filter(d=>{
    if(d.status==='deleted')return false;
    if(f.type&&d.type!==f.type)return false;
    if(f.cat&&d.categoryId!==f.cat)return false;
    if(f.from&&String(d.date||'')<f.from)return false;
    if(f.to&&String(d.date||'')>f.to)return false;
    if(f.q){const q=f.q.toLowerCase();return [d.number,d.title,d.content,d.refNumber,d.fromParty,d.toParty,d.closing].some(x=>String(x||'').toLowerCase().includes(q));}
    return true;
  }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
function vDocuments(){
  const list=filteredDocs(),canC=can('documents','create');
  return `<div class="bg-white rounded-xl border p-4 mb-4"><div class="grid md:grid-cols-5 gap-2">

    <select onchange="S.filters.type=this.value;renderDocTable()" class="${INP}"><option value="">ทุกประเภท</option>${Object.entries(DOC_TYPES).map(([k,v])=>`<option value="${k}" ${S.filters.type===k?'selected':''}>${v}</option>`).join('')}</select>

    <div class="flex gap-2"><input type="date" value="${S.filters.from}" onchange="S.filters.from=this.value;renderDocTable()" class="${INP}"><input type="date" value="${S.filters.to}" onchange="S.filters.to=this.value;renderDocTable()" class="${INP}"></div>

}

async function delDoc(id){

async function uploadTplLogo(which,input){
  const f=input.files[0];if(!f)return;
  if(f.size>8*1024*1024){toast('ภาพใหญ่เกิน 8MB','error');input.value='';return;}
  toast('กำลังอัปโหลดโลโก้...','info');
  const b64=await fileToBase64(f);
  const out=await api('files.upload',{fileName:f.name,mimeType:f.type,base64:b64});
  input.value='';
  if(!out.success)return toast(out.message,'error');
  if(which===1){tplDraft.logoId=out.file.id;tplDraft.logoName=out.file.name;tplDraft.logoUrl=out.file.imgUrl||out.file.url;const n=$('#tf-logo1name');if(n)n.textContent='ไฟล์: '+out.file.name;}
  else{tplDraft.logo2Id=out.file.id;tplDraft.logo2Name=out.file.name;tplDraft.logo2Url=out.file.imgUrl||out.file.url;const n=$('#tf-logo2name');if(n)n.textContent='ไฟล์: '+out.file.name;}
  renderTplPreview();
}
function renderTplPreview(){
  const el=$('#tpl-preview');if(!el)return;
  const t=tplDraft,w=t.logoWidthCm||2.5;
  const img1=t.logoUrl?`<img src="${esc(t.logoUrl)}" style="width:${w}cm;max-width:100%">`:'<span class="text-slate-300 text-xs">(ยังไม่มีโลโก้)</span>';
  const img2=t.logo2Url?`<img src="${esc(t.logo2Url)}" style="width:${w}cm;max-width:100%">`:(t.logoUrl?`<img src="${esc(t.logoUrl)}" style="width:${w}cm;max-width:100%">`:'<span class="text-slate-300 text-xs">(โลโก้)</span>');
  const txt=`<div class="text-center leading-snug"><div class="font-bold text-base">${esc(t.headerMain||'')}</div>${t.headerSub?`<div class="font-bold text-sm">${esc(t.headerSub)}</div>`:''}${t.headerAddress?`<div class="text-xs text-slate-600">${esc(t.headerAddress)}</div>`:''}</div>`;
  let h='';
  if((t.logoPos||'center')==='center')h=`<div class="flex flex-col items-center gap-1">${img1}${txt}</div>`;
  else if(t.logoPos==='both')h=`<div class="flex items-center gap-3"><div>${img1}</div><div class="flex-1">${txt}</div><div>${img2}</div></div>`;
  else if(t.logoPos==='left')h=`<div class="flex items-center gap-3"><div>${img1}</div><div class="flex-1">${txt}</div></div>`;
  else h=`<div class="flex items-center gap-3"><div class="flex-1">${txt}</div><div>${img1}</div></div>`;
  el.innerHTML=h+'<hr class="my-2 border-slate-400">';
}

async function delTpl(id){
  if(!await confirmBox('ยืนยันการลบแผ่นแบบนี้?'))return;
  const out=await api('templates.delete',{id});
  if(out.success){toast('ลบแผ่นแบบแล้ว');await reloadTemplates();render();}else toast(out.message,'error');
}

async function addDocImage(input){
  const f=input.files[0];if(!f)return;
  if(f.size>8*1024*1024){toast('ภาพใหญ่เกิน 8MB','error');input.value='';return;}
  toast('กำลังอัปโหลดภาพ...','info');
  const b64=await fileToBase64(f);
  const out=await api('files.upload',{fileName:f.name,mimeType:f.type,base64:b64});
  input.value='';
  if(!out.success)return toast(out.message,'error');
  editingImages.push({fileId:out.file.id,name:out.file.name,url:out.file.imgUrl||out.file.url,imgUrl:out.file.imgUrl||out.file.url,position:'center',widthCm:12,caption:''});
  renderImgList();
}
function renderImgList(){
  const el=$('#img-list');if(!el)return;
  el.innerHTML=editingImages.map((im,i)=>`
  <div class="border rounded-lg p-2.5 flex gap-3 items-center bg-slate-50">
    <img src="${esc(im.imgUrl||im.url)}" class="w-16 h-16 object-contain border rounded bg-white shrink-0">
    <div class="flex-1 grid sm:grid-cols-4 gap-2 items-center">
      <span class="text-xs text-slate-500 truncate sm:col-span-4 -mb-2" title="${esc(im.name)}">${esc(im.name)}</span>
      <select class="${INP} !py-1.5" onchange="editingImages[${i}].position=this.value">${[['center','กลาง'],['left','ซ้าย'],['right','ขวา']].map(o=>`<option value="${o[0]}" ${im.position===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
      <input type="number" step="0.5" min="2" max="25" value="${im.widthCm||12}" title="ความกว้าง (ซม.)" class="${INP} !py-1.5" oninput="editingImages[${i}].widthCm=parseFloat(this.value)||12">
      <input placeholder="คำบรรยายใต้ภาพ" value="${esc(im.caption||'')}" class="${INP} !py-1.5 sm:col-span-2" oninput="editingImages[${i}].caption=this.value">
    </div>
    <div class="flex flex-col gap-1">
      <button type="button" onclick="mvImg(${i},-1)" class="text-slate-400 hover:text-slate-700 text-xs">▲</button>
      <button type="button" onclick="mvImg(${i},1)" class="text-slate-400 hover:text-slate-700 text-xs">▼</button>
      <button type="button" onclick="rmImg(${i})" class="text-red-500 hover:text-red-700 text-xs">✕</button>
    </div>
  </div>`).join('')||'<p class="text-xs text-slate-400">ยังไม่มีภาพประกอบ — เลือกไฟล์ภาพด้านบนเพื่อเพิ่ม</p>';
}
function mvImg(i,dir){const j=i+dir;if(j<0||j>=editingImages.length)return;const a=editingImages;[a[i],a[j]]=[a[j],a[i]];renderImgList();}
function rmImg(i){editingImages.splice(i,1);renderImgList();}
async function docFormSubmit(e){
  e.preventDefault();
  const id=$('#df-id').value;
  const doc={id:id||'',type:$('#df-type').value,date:$('#df-date').value,number:$('#df-number').value.trim(),refNumber:$('#df-ref').value.trim(),
    title:$('#df-title').value.trim(),categoryId:$('#df-cat').value,templateId:$('#df-tpl').value,
    urgency:$('#df-urg').value,classification:$('#df-cls').value,fromParty:$('#df-from').value.trim(),toParty:$('#df-to').value.trim(),
    content:$('#df-content').value,signer:$('#df-signer').value.trim(),signerPosition:$('#df-pos').value.trim(),remark:$('#df-remark').value.trim(),
    closing:$('#df-closing')?$('#df-closing').value.trim():'',
    images:editingImages.map(x=>({...x}))};
  if(!doc.title){toast('กรุณาระบุเรื่อง','error');return;}
  if(pendingFile){
    toast('กำลังอัปโหลดไฟล์แนบ...','info');
    let out;
    if(DEMO)out={success:true,file:{id:'demo',name:pendingFile.name,url:'#'}};
    else{const b64=await fileToBase64(pendingFile);out=await api('files.upload',{fileName:pendingFile.name,mimeType:pendingFile.type,base64:b64});}
    if(out.success){doc.fileId=out.file.id;doc.fileName=out.file.name;doc.fileUrl=out.file.url;}
    else return toast(out.message,'error');
  }else if(id){const old=S.docs.find(x=>x.id===id);if(old){doc.fileId=old.fileId;doc.fileName=old.fileName;doc.fileUrl=old.fileUrl;}}
  const out=await api('documents.save',{doc});
  if(out.success){toast((id?'แก้ไข':'สร้าง')+'เอกสารสำเร็จ — เลขที่ '+out.number);closeModal();await reloadDocs();go('docview',out.id);}
  else toast(out.message,'error');
}

async function resolveSrc(fileId,fallbackUrl){
  if(DEMO)return fallbackUrl;
  if(!fileId)return fallbackUrl||'';
  const r=await api('files.getBase64',{fileId});
  return r.success?r.data:(fallbackUrl||'');
}
async function buildDocHTML(d,forWord){
  const tpl=S.templates.find(t=>t.id===d.templateId)||S.templates.find(t=>t.isDefault)||null;
  const F="font-family:'TH Sarabun New','Sarabun',serif;font-size:16pt;line-height:1.7";
  const w=tpl?(parseFloat(tpl.logoWidthCm)||2.5):2.5;
  const logo=async n=>{if(!tpl)return '';const id=n==='2'?tpl.logo2Id:tpl.logoId,url=n==='2'?tpl.logo2Url:tpl.logoUrl;
    if(!id&&!url)return '';
    const src=forWord?await resolveSrc(id,url):(url||'');
    return `<img src="${src}" style="width:${w}cm">`;};
  let header='';
  if(tpl){
    const txt=`<div style="text-align:center;font-weight:bold;font-size:17pt">${esc(tpl.headerMain||'')}</div>
      ${tpl.headerSub?`<div style="text-align:center;font-weight:bold;font-size:14pt">${esc(tpl.headerSub)}</div>`:''}
      ${tpl.headerAddress?`<div style="text-align:center;font-size:12pt">${esc(tpl.headerAddress)}</div>`:''}`;
    const pos=tpl.logoPos||'center';
    if(pos==='center')header=`<div style="text-align:center;margin-bottom:6px">${await logo(1)}</div>${txt}`;
    else if(pos==='both')header=`<table style="width:100%;border-collapse:collapse"><tr><td style="width:22%;vertical-align:middle">${await logo(1)}</td><td style="vertical-align:middle">${txt}</td><td style="width:22%;text-align:right;vertical-align:middle">${(await logo(2))||(await logo(1))}</td></tr></table>`;
    else if(pos==='left')header=`<table style="width:100%;border-collapse:collapse"><tr><td style="width:22%;vertical-align:middle">${await logo(1)}</td><td style="vertical-align:middle">${txt}</td><td style="width:22%"></td></tr></table>`;
    else header=`<table style="width:100%;border-collapse:collapse"><tr><td style="width:22%"></td><td style="vertical-align:middle">${txt}</td><td style="width:22%;text-align:right;vertical-align:middle">${await logo(1)}</td></tr></table>`;
    header+=`<hr style="border:none;border-top:2px solid #000;margin:8px 0 14px">`;
  }
  let imgsHTML='';
  const imgs=parseImgs(d.images);
  for(let i=0;i<imgs.length;i++){
    const im=imgs[i];let src=im.imgUrl||im.url||'';
    if(forWord&&im.fileId)src=await resolveSrc(im.fileId,src);
    const al={left:'left',center:'center',right:'right'}[im.position]||'center';
    imgsHTML+=`<div style="text-align:${al};margin:12px 0"><img src="${src}" style="width:${parseFloat(im.widthCm)||12}cm"></div>
      ${im.caption?`<div style="text-align:${al};font-size:14pt;margin-bottom:6px">ภาพที่ ${i+1} ${esc(im.caption)}</div>`:''}`;
  }
  const sig=d.signer?`<div style="margin-top:48px;width:320px;margin-left:auto;text-align:center;font-size:16pt;line-height:1.8"><div>(ลงชื่อ) ........................................</div><div>( ${esc(d.signer)} )</div>${d.signerPosition?`<div>${esc(d.signerPosition)}</div>`:''}</div>`:'';
  const row=(l,v)=>`<tr><td style="width:140px;vertical-align:top">${l}</td><td>${v}</td></tr>`;
  const closing=String(d.closing||'').trim();
  const closingHTML=closing?`<div style="margin-top:10px">${esc(closing)}</div>`:'';
  if(d.type==='internal'){
    const orgName=tpl?[tpl.headerMain,tpl.headerSub].filter(Boolean).join(' '):(APP_CONFIG.ORG_FULL+' '+APP_CONFIG.ORG_SUB);
    const orgAddr=tpl?(tpl.headerAddress||''):APP_CONFIG.ORG_ADDRESS;
    const logoInt=(tpl&&tpl.useInternal)?`<div style="text-align:${tpl.logoPos==='right'?'right':'left'};margin-bottom:4px">${await logo(1)}</div>`:'';
    return `<div style="${F}">${logoInt}
      <div style="text-align:right;font-size:12pt">แบบ สธ 03/2553</div>
      <h2 style="text-align:center;margin:4px 0 14px">บันทึกข้อความ</h2>
      <table style="width:100%;border-collapse:collapse">
        ${row('ส่วนราชการ',esc(orgName)+' '+esc(orgAddr))}
        ${row('ที่',esc(d.number))}
        ${row('วันที่',thaiDate(d.date))}
        ${row('เรื่อง','<b>'+esc(d.title)+'</b>')}
        ${d.toParty?row('เรียน',esc(d.toParty)):''}
      </table>
      <div style="white-space:pre-wrap;margin-top:14px">${esc(d.content||'')}</div>
      ${imgsHTML}
      ${closingHTML}${sig}</div>`;
  }
  return `<div style="${F}">${header}
    <table style="width:100%;border-collapse:collapse">
      ${row('ที่',esc(d.number))}
      ${row('วันที่',thaiDate(d.date))}
      ${d.refNumber?row('อ้างถึง',esc(d.refNumber)):''}
      ${row('เรื่อง','<b>'+esc(d.title)+'</b>')}
      ${d.fromParty?row('จาก',esc(d.fromParty)):''}
      ${d.toParty?row('ถึง',esc(d.toParty)):''}
    </table>
    <div style="white-space:pre-wrap;margin-top:14px">${esc(d.content||'')}</div>
    ${imgsHTML}
    ${closingHTML}${sig}</div>`;
}
async function printDoc(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;
  $('#print-area').innerHTML=await buildDocHTML(d,false);
  window.print();
}
async function exportWord(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;
  toast('กำลังเตรียมไฟล์ Word (ฝังโลโก้และภาพประกอบ)...','info');
  const inner=await buildDocHTML(d,true);
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(d.number)}</title><style>body{font-family:'TH Sarabun New','Sarabun',serif;font-size:16pt;line-height:1.7}@page{size:A4;margin:2cm}</style></head><body>${inner}</body></html>`;
  download(String(d.number).replace(/[\\/:*?"<>|]/g,'-')+'.doc',html,'application/msword');
  toast('ส่งออกไฟล์ Word แล้ว');
}

/* ================= หมวดหมู่ ================= */
function vCategories(){
  return `<div class="flex items-center justify-between mb-3"><p class="text-sm text-slate-500">ทะเบียนหมวดเรื่องตามระเบียบงานสารบรรณ</p>
    <button onclick="openCatForm()" class="${BTN_P}">＋ เพิ่มหมวดหมู่</button></div>
  <div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="bg-slate-50 text-left text-slate-500 text-xs"><th class="px-3 py-3">รหัส</th><th class="px-3 py-3">ชื่อหมวดหมู่</th><th class="px-3 py-3">คำอธิบาย</th><th class="px-3 py-3">เอกสาร</th><th class="px-3 py-3">สถานะ</th><th class="px-3 py-3 text-right">จัดการ</th></tr></thead><tbody>
    ${S.cats.map(c=>`<tr class="border-t hover:bg-slate-50">
      <td class="px-3 py-2.5 font-mono font-semibold text-brand-800">${esc(c.code)}</td>
      <td class="px-3 py-2.5 font-medium text-slate-700">${esc(c.name)}</td>
      <td class="px-3 py-2.5 text-slate-500 text-xs max-w-xs"><div class="truncate" title="${esc(c.description||'')}">${esc(c.description||'—')}</div></td>
      <td class="px-3 py-2.5">${S.docs.filter(d=>d.categoryId===c.id&&d.status!=='deleted').length}</td>
      <td class="px-3 py-2.5">${c.active?'<span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">ใช้งาน</span>':'<span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">ปิดใช้งาน</span>'}</td>
      <td class="px-3 py-2.5 text-right whitespace-nowrap"><button onclick="openCatForm('${c.id}')" class="text-amber-600 hover:underline text-xs font-medium">แก้ไข</button> · <button onclick="delCat('${c.id}')" class="text-red-600 hover:underline text-xs font-medium">ลบ</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function openCatForm(id){
  const c=id?S.cats.find(x=>x.id===id):null;
  openModal(c?'แก้ไขหมวดหมู่':'เพิ่มหมวดหมู่',`
  <form onsubmit="catFormSubmit(event)" class="space-y-4">
    <input type="hidden" id="cf-id" value="${c?esc(c.id):''}">
    <div class="grid grid-cols-[100px_1fr] gap-3">
      <div><label class="${LBL}">รหัส *</label><input id="cf-code" class="${INP}" required value="${c?esc(c.code):''}" placeholder="01"></div>
      <div><label class="${LBL}">ชื่อหมวดหมู่ *</label><input id="cf-name" class="${INP}" required value="${c?esc(c.name):''}"></div></div>
    <div><label class="${LBL}">คำอธิบาย</label><input id="cf-desc" class="${INP}" value="${c?esc(c.description||''):''}"></div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="cf-active" ${!c||c.active?'checked':''}> ใช้งานหมวดหมู่นี้</label>
    <div class="flex justify-end gap-2 pt-2 border-t"><button type="button" onclick="closeModal()" class="${BTN_G}">ยกเลิก</button><button type="submit" class="${BTN_P}">💾 บันทึก</button></div></form>`);
}
async function catFormSubmit(e){
  e.preventDefault();
  const cat={id:$('#cf-id').value,code:$('#cf-code').value.trim(),name:$('#cf-name').value.trim(),description:$('#cf-desc').value.trim(),active:$('#cf-active').checked};
  const out=await api('categories.save',{cat});
  if(out.success){toast('บันทึกหมวดหมู่แล้ว');closeModal();const r=await api('categories.list');if(r.success)S.cats=r.cats;render();}
  else toast(out.message,'error');
}
async function delCat(id){
  if(!await confirmBox('ยืนยันการลบหมวดหมู่นี้?'))return;
  const out=await api('categories.delete',{id});
  if(out.success){toast('ลบหมวดหมู่แล้ว');const r=await api('categories.list');if(r.success)S.cats=r.cats;render();}else toast(out.message,'error');
}

/* ================= ผู้ใช้งาน ================= */
function vUsers(){
  if(!can('users','manage'))return '<p class="text-slate-500">คุณไม่มีสิทธิ์เข้าถึงส่วนนี้</p>';
  return `<div class="flex items-center justify-between mb-3"><p class="text-sm text-slate-500">บัญชีผู้ใช้ (อีเมล + รหัสผ่าน) และการกำหนดสิทธิ์รายบุคคล</p>
    <button onclick="openUserForm()" class="${BTN_P}">＋ เพิ่มผู้ใช้</button></div>
  <div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="bg-slate-50 text-left text-slate-500 text-xs"><th class="px-3 py-3">ชื่อ-สกุล</th><th class="px-3 py-3">อีเมล</th><th class="px-3 py-3">ตำแหน่ง</th><th class="px-3 py-3">บทบาท</th><th class="px-3 py-3">สถานะ</th><th class="px-3 py-3">เข้าใช้ล่าสุด</th><th class="px-3 py-3 text-right">จัดการ</th></tr></thead>
    <tbody id="users-tbody"><tr><td colspan="7" class="px-3 py-10 text-center text-slate-400">กำลังโหลด...</td></tr></tbody></table></div>`;
}
async function loadUsers(){
  const r=await api('users.list');if(!r.success)return;
  S.users=r.users;const tb=$('#users-tbody');if(!tb)return;
  tb.innerHTML=S.users.map(u=>`<tr class="border-t hover:bg-slate-50">
    <td class="px-3 py-2.5 font-medium text-slate-700">${esc(u.name||'—')}</td>
    <td class="px-3 py-2.5 text-slate-500">${esc(u.email)}</td>
    <td class="px-3 py-2.5 text-slate-500 text-xs max-w-[200px]"><div class="truncate" title="${esc(u.position||'')}">${esc(u.position||'—')}</div></td>
    <td class="px-3 py-2.5">${u.role==='admin'?'<span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-800 font-semibold">ผู้ดูแลระบบ</span>':'<span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">ผู้ใช้ทั่วไป</span>'}</td>
    <td class="px-3 py-2.5">${u.status==='active'?'<span class="text-xs text-emerald-700">ใช้งาน</span>':'<span class="text-xs text-red-600">ระงับ</span>'}</td>
    <td class="px-3 py-2.5 text-xs text-slate-400">${u.lastLogin?dtLoc(u.lastLogin):'—'}</td>
    <td class="px-3 py-2.5 text-right whitespace-nowrap"><button onclick="openUserForm('${u.id}')" class="text-amber-600 hover:underline text-xs font-medium">แก้ไข</button> · <button onclick="delUser('${u.id}')" class="text-red-600 hover:underline text-xs font-medium">ลบ</button></td></tr>`).join('');
}
function permBoxesHTML(perm){
  return Object.entries(PERM_DEF).map(([area,def])=>`
    <div class="border rounded-lg p-3"><div class="font-semibold text-slate-700 text-sm mb-2">${def.label}</div>
    <div class="flex flex-wrap gap-x-4 gap-y-1.5">${Object.entries(def.acts).map(([act,label])=>{
      const on=perm[area]&&perm[area][act];
      return `<label class="flex items-center gap-1.5 text-sm text-slate-600"><input type="checkbox" data-perm="${area}.${act}" ${on?'checked':''}> ${label}</label>`;}).join('')}</div></div>`).join('');
}
function openUserForm(id){
  const u=id?S.users.find(x=>x.id===id):null;
  const perm=u?safeParse(u.permissions):{};
  openModal(u?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งาน',`
  <form onsubmit="userFormSubmit(event)" class="space-y-4">
    <input type="hidden" id="uf-id" value="${u?esc(u.id):''}">
    <div class="grid md:grid-cols-2 gap-3">
      <div><label class="${LBL}">อีเมล (ใช้เข้าสู่ระบบ) *</label><input id="uf-email" type="email" class="${INP}" required value="${u?esc(u.email):''}" placeholder="name@msu.ac.th"></div>
      <div><label class="${LBL}">รหัสผ่าน ${u?'(เว้นว่าง = ไม่เปลี่ยน)':'*'}</label><input id="uf-pass" type="text" class="${INP}" ${u?'':'required'} placeholder="ตัวอักษร/ตัวเลข/อักขระพิเศษ อย่างน้อย 6 ตัว"></div>
      <div><label class="${LBL}">ชื่อ-สกุล</label><input id="uf-name" class="${INP}" value="${u?esc(u.name||''):''}"></div>
      <div><label class="${LBL}">ตำแหน่ง</label><input id="uf-position" class="${INP}" value="${u?esc(u.position||''):''}"></div>
      <div><label class="${LBL}">บทบาท</label><select id="uf-role" class="${INP}"><option value="user" ${u&&u.role==='user'?'selected':''}>ผู้ใช้ทั่วไป (กำหนดสิทธิ์รายบุคคล)</option><option value="admin" ${u&&u.role==='admin'?'selected':''}>ผู้ดูแลระบบ (สิทธิ์ทั้งหมด)</option></select></div>
      <div><label class="${LBL}">สถานะ</label><select id="uf-status" class="${INP}"><option value="active" ${!u||u.status==='active'?'selected':''}>ใช้งาน</option><option value="inactive" ${u&&u.status==='inactive'?'selected':''}>ระงับ</option></select></div>
    </div>
    <div><label class="${LBL}">สิทธิ์การใช้งาน (สำหรับผู้ใช้ทั่วไป)</label><div class="grid md:grid-cols-2 gap-2">${permBoxesHTML(perm)}</div></div>
    <div class="flex justify-end gap-2 pt-2 border-t"><button type="button" onclick="closeModal()" class="${BTN_G}">ยกเลิก</button><button type="submit" class="${BTN_P}">💾 บันทึก</button></div></form>`,true);
}
async function userFormSubmit(e){
  e.preventDefault();
  const p={};
  document.querySelectorAll('[data-perm]').forEach(cb=>{if(cb.checked){const[a,x]=cb.dataset.perm.split('.');(p[a]=p[a]||{})[x]=1;}});
  const user={id:$('#uf-id').value,email:$('#uf-email').value.trim(),name:$('#uf-name').value.trim(),position:$('#uf-position').value.trim(),
    role:$('#uf-role').value,status:$('#uf-status').value,permissions:p,password:$('#uf-pass').value};
  if(!user.id&&String(user.password||'').length<6)return toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร','error');
  const out=await api('users.save',{user});
  if(out.success){toast('บันทึกผู้ใช้งานแล้ว');closeModal();loadUsers();}else toast(out.message,'error');
}
async function delUser(id){
  if(!await confirmBox('ยืนยันการลบบัญชีผู้ใช้นี้?'))return;
  const out=await api('users.delete',{id});
  if(out.success){toast('ลบผู้ใช้แล้ว');loadUsers();}else toast(out.message,'error');
}

/* ================= Logs / บัญชี ================= */
function vLogs(){
  if(!can('logs','view'))return '<p class="text-slate-500">คุณไม่มีสิทธิ์เข้าถึงส่วนนี้</p>';
  return `<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="bg-slate-50 text-left text-slate-500 text-xs"><th class="px-3 py-3">วันเวลา</th><th class="px-3 py-3">ผู้ใช้</th><th class="px-3 py-3">การกระทำ</th><th class="px-3 py-3">รายละเอียด</th></tr></thead>
    <tbody id="logs-tbody"><tr><td colspan="4" class="px-3 py-10 text-center text-slate-400">กำลังโหลด...</td></tr></tbody></table></div>`;
}
async function loadLogs(){
  const r=await api('logs.list');if(!r.success)return;
  const tb=$('#logs-tbody');if(!tb)return;
  tb.innerHTML=r.logs.map(l=>`<tr class="border-t">
    <td class="px-3 py-2 whitespace-nowrap text-slate-500 text-xs">${esc(dtLoc(l.timestamp))}</td>
    <td class="px-3 py-2 text-slate-600">${esc(l.email)}</td>
    <td class="px-3 py-2"><span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-mono">${esc(l.action)}</span></td>
    <td class="px-3 py-2 text-slate-500 text-xs max-w-md"><div class="truncate" title="${esc(l.detail||'')}">${esc(l.detail||'')}</div></td></tr>`).join('')||'<tr><td colspan="4" class="px-3 py-10 text-center text-slate-400">ไม่มีข้อมูล</td></tr>';
}
function vAccount(){
  return `<div class="grid lg:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border p-5"><h3 class="font-bold text-slate-800 mb-4">ข้อมูลบัญชี</h3>
      <div class="space-y-2 text-sm">
        <div class="flex gap-2"><span class="text-slate-400 w-24">ชื่อ</span><span class="text-slate-700">${esc(S.user.name||'—')}</span></div>
        <div class="flex gap-2"><span class="text-slate-400 w-24">อีเมล</span><span class="text-slate-700">${esc(S.user.email)}</span></div>
        <div class="flex gap-2"><span class="text-slate-400 w-24">ตำแหน่ง</span><span class="text-slate-700">${esc(S.user.position||'—')}</span></div>
        <div class="flex gap-2"><span class="text-slate-400 w-24">บทบาท</span><span class="text-slate-700">${S.user.role==='admin'?'ผู้ดูแลระบบ':'ผู้ใช้ทั่วไป'}</span></div></div></div>
    <div class="bg-white rounded-xl border p-5"><h3 class="font-bold text-slate-800 mb-4">เปลี่ยนรหัสผ่าน</h3>
      <form onsubmit="changePassSubmit(event)" class="space-y-3">
        <div><label class="${LBL}">รหัสผ่านปัจจุบัน</label><input id="cp-old" type="password" class="${INP}" required></div>
        <div><label class="${LBL}">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label><input id="cp-new" type="password" class="${INP}" required minlength="6"></div>
        <div><label class="${LBL}">ยืนยันรหัสผ่านใหม่</label><input id="cp-new2" type="password" class="${INP}" required></div>
        <button type="submit" class="${BTN_P}">เปลี่ยนรหัสผ่าน</button></form></div></div>`;
}
async function changePassSubmit(e){
  e.preventDefault();
  if($('#cp-new').value!==$('#cp-new2').value)return toast('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน','error');
  const out=await api('changePassword',{oldPassword:$('#cp-old').value,newPassword:$('#cp-new').value});
  if(out.success){toast(out.message||'เปลี่ยนรหัสผ่านสำเร็จ');e.target.reset();}else toast(out.message,'error');
}
