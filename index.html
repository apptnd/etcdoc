function parseDate(v){ const s=String(v||''); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); const d=new Date(s); return isNaN(d)?null:d; }
function thaiDate(v){ const d=parseDate(v); return d? `${d.getDate()} ${THAI_M[d.getMonth()]} ${d.getFullYear()+543}` : '—'; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dtLoc(v){ const d=new Date(v); return isNaN(d)?String(v||''):d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}); }
function safeParse(s){ try{return JSON.parse(s||'{}')}catch(e){return{}} }

function toast(msg, type='success'){
  const el=document.createElement('div');
  el.className=`px-4 py-3 rounded-lg shadow-lg text-white text-sm ${type==='error'?'bg-red-600':type==='info'?'bg-slate-700':'bg-emerald-600'}`;
  el.textContent=msg; $('#toast-root').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},2800);
}
function openModal(title, bodyHTML){

    <div class="p-5">${bodyHTML}</div></div>`;
  $('#modal-root').classList.remove('hidden');
}
function closeModal(){ $('#modal-root').classList.add('hidden'); $('#modal-root').innerHTML=''; }
 $('#modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root') closeModal(); });
function confirmBox(msg){

}

/* ---------- State ---------- */
let S = { token: localStorage.getItem('edoc_token')||'', user:null, docs:[], cats:[], users:[], logs:[],

function can(area, act){
  if(!S.user) return false;
  if(S.user.role==='admin') return true;
  const p = safeParse(S.user.permissions);
  return !!(p[area] && p[area][act]);
}

/* ============================================================
 * ชั้นเรียก API — เชื่อม Google Apps Script (หรือโหมดตัวอย่าง)
 * ============================================================ */
async function api(action, data={}){
  if(DEMO) return demoApi(action, data);
  try{
    const res = await fetch(APP_CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // หลีกเลี่ยง CORS preflight
      body: JSON.stringify({...data, action, token:S.token})
    });
    const out = await res.json();
    if(out && out.success===false && /เซสชัน|ไม่พบผู้ใช้/.test(out.message||'')) forceLogout();
    return out;
  }catch(err){ return {success:false, message:'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: '+err.message}; }
}
