function parseDate(v){ const s=String(v||''); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); const d=new Date(s); return isNaN(d)?null:d; }
function thaiDate(v){ const d=parseDate(v); return d? `${d.getDate()} ${THAI_M[d.getMonth()]} ${d.getFullYear()+543}` : '—'; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dtLoc(v){ const d=new Date(v); return isNaN(d)?String(v||''):d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}); }
function safeParse(s){ try{return JSON.parse(s||'{}')}catch(e){return{}} }

function toast(msg, type='success'){
  const el=document.createElement('div');
  el.className=`px-4 py-3 rounded-lg shadow-lg text-white text-sm ${type==='error'?'bg-red-600':type==='info'?'bg-slate-700':'bg-emerald-600'}`;
  el.textContent=msg; $('#toast-root').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},2800);
}
function openModal(title, bodyHTML, wide){
  const w = wide? 'max-w-3xl':'max-w-2xl';
  $('#modal-root').innerHTML=`<div class="bg-white rounded-xl shadow-2xl w-full ${w} max-h-[92vh] overflow-y-auto">
    <div class="flex items-center justify-between p-4 border-b sticky top-0 bg-white z-10">

      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
    </div><div class="p-5">${bodyHTML}</div></div>`;
  $('#modal-root').classList.remove('hidden');
}
function closeModal(){ $('#modal-root').classList.add('hidden'); $('#modal-root').innerHTML=''; }
 $('#modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root') closeModal(); });
function confirmBox(msg){
  return new Promise(res=>{
    openModal('ยืนยันการดำเนินการ',`<p class="text-slate-600">${msg}</p>

  });
}
function fileToBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
function download(name, content, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime||'text/plain;charset=utf-8'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ---------- State ---------- */
let S = { token: localStorage.getItem('edoc_token')||'', user:null, docs:[], cats:[], users:[], logs:[],
          filters:{q:'',type:'',cat:'',from:'',to:''}, dashMonth:'', view:'dashboard', param:null };
let pendingFile = null;

function can(area, act){
  if(!S.user) return false;
  if(S.user.role==='admin') return true;
  const p = safeParse(S.user.permissions);
  return !!(p[area] && p[area][act]);
}

/* ============================================================
 * ชั้นเรียก API (จริง = Google Apps Script / จำลอง = localStorage)
 * ============================================================ */
async function api(action, data={}){
  if(DEMO) return demoApi(action, data);
  try{
    const res = await fetch(APP_CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({...data, action, token:S.token})
    });
    const out = await res.json();
    if(out && out.success===false && /เซสชัน|ไม่พบผู้ใช้/.test(out.message||'')) forceLogout();
    return out;
  }catch(err){
    return {success:false, message:'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: '+err.message+' — ตรวจสอบว่า Deploy แบบ "Anyone" และ API_URL ถูกต้อง'};
  }
}
function forceLogout(){ localStorage.removeItem('edoc_token'); localStorage.removeItem('edoc_demo_email'); location.reload(); }

function demoDB(){
  let db=null;
  try{ db=JSON.parse(localStorage.getItem('edoc_demo_db')||'null'); }catch(e){}
  if(!db){
    db={ users:DEMO_SEED.users.map(u=>({...u})), cats:DEMO_SEED.cats.map(c=>({...c})), docs:DEMO_SEED.docs.map(d=>({...d})), logs:[] };
    localStorage.setItem('edoc_demo_db', JSON.stringify(db));
  }
  return db;
}
function saveDB(db){ localStorage.setItem('edoc_demo_db', JSON.stringify(db)); }
function demoUser(db){ const e=localStorage.getItem('edoc_demo_email'); return e? db.users.find(u=>u.email===e):null; }
function pubU(u){ const {pass,...rest}=u; return rest; }
function demoNextNumber(db, type){
  const y=String(new Date().getFullYear()+543); let max=0;
  db.docs.forEach(d=>{ const m=String(d.number||'').match(/(\d{4})\s*\/\s*(\d{4})\s*$/); if(m&&m[2]===y) max=Math.max(max,parseInt(m[1],10)); });
  const seq=String(max+1).padStart(4,'0');
  return type==='internal'? APP_CONFIG.DOC_PREFIX+' '+seq+'/'+y : (type==='incoming'?'รับ ':'ส่ง ')+seq+'/'+y;
}

async function demoApi(action, data){
  await sleep(250);
  const db = demoDB();
  const dlog=(a,x)=>{ db.logs.unshift({timestamp:new Date().toISOString(), email:(demoUser(db)||{}).email||'-', action:a, detail:x}); db.logs=db.logs.slice(0,300); };
  switch(action){
    case 'ping': return {success:true};
    case 'login': {
      const email=String(data.email||'').trim().toLowerCase();
      const u=db.users.find(x=>x.email===email);
      if(!u || u.pass!==data.password) return {success:false, message:'อีเมลหรือรหัสผ่านไม่ถูกต้อง (โหมดตัวอย่าง: admin@msu.ac.th / Admin@123)'};
      if(u.status!=='active') return {success:false, message:'บัญชีนี้ถูกระงับการใช้งาน'};
      u.lastLogin=new Date().toISOString();
      localStorage.setItem('edoc_demo_email', email);
      dlog('login','เข้าสู่ระบบสำเร็จ'); saveDB(db);
      return {success:true, token:'demo-'+Math.random().toString(36).slice(2), user:pubU(u)};
    }
    case 'logout': localStorage.removeItem('edoc_demo_email'); return {success:true};
    case 'me': {
      const u=demoUser(db);
      return u? {success:true,user:pubU(u)} : {success:false,message:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'};
    }
    case 'changePassword': {
      const u=demoUser(db); if(!u) return {success:false,message:'เซสชันหมดอายุ'};
      if(u.pass!==data.oldPassword) return {success:false,message:'รหัสผ่านเดิมไม่ถูกต้อง'};
      if(!data.newPassword||String(data.newPassword).length<6) return {success:false,message:'รหัสผ่านใหม่ต้องยาวอย่างน้อย 6 ตัวอักษร'};
      u.pass=String(data.newPassword); dlog('changePassword','เปลี่ยนรหัสผ่าน'); saveDB(db);
      return {success:true,message:'เปลี่ยนรหัสผ่านสำเร็จ'};
    }
    case 'documents.list': return {success:true, docs:db.docs.filter(d=>d.status!=='deleted')};
    case 'documents.save': {
      const d=data.doc||{};
      const num=String(d.number||'').trim()||demoNextNumber(db,d.type);
      if(d.id){
        const i=db.docs.findIndex(x=>x.id===d.id);
        if(i<0) return {success:false,message:'ไม่พบเอกสารนี้'};
        db.docs[i]={...db.docs[i], ...d, number:num, updatedAt:new Date().toISOString()};
        dlog('documents.update', d.id+' | '+d.title); saveDB(db);
        return {success:true, id:d.id, number:num};
      }
      const id='D'+String(db.docs.length+1).padStart(5,'0');
      const now=new Date().toISOString();
      db.docs.push({id, number:num, refNumber:String(d.refNumber||''), type:d.type, title:d.title, date:d.date,
        categoryId:d.categoryId||'', fromParty:d.fromParty||'', toParty:d.toParty||'', urgency:d.urgency||'ปกติ',
        classification:d.classification||'ปกติ', content:d.content||'', signer:d.signer||'', signerPosition:d.signerPosition||'',
        fileId:d.fileId||'', fileName:d.fileName||'', fileUrl:d.fileUrl||'', status:'active',
        createdBy:(demoUser(db)||{}).email||'-', createdAt:now, updatedAt:now, remark:d.remark||''});
      dlog('documents.create', id+' | '+d.title); saveDB(db);
      return {success:true, id, number:num};
    }
    case 'documents.delete': {
      const i=db.docs.findIndex(x=>x.id===data.id);
      if(i<0) return {success:false,message:'ไม่พบเอกสารนี้'};
      db.docs[i].status='deleted'; dlog('documents.delete', data.id); saveDB(db);
      return {success:true};
    }
    case 'categories.list': return {success:true, cats:db.cats.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)))};
    case 'categories.save': {
      const c=data.cat||{};
      if(c.id){
        const i=db.cats.findIndex(x=>x.id===c.id);
        if(i<0) return {success:false,message:'ไม่พบหมวดหมู่นี้'};
        db.cats[i]={...db.cats[i], code:c.code, name:c.name, description:c.description||'', active:!!c.active};
      } else {
        db.cats.push({id:'C'+String(db.cats.length+1).padStart(2,'0'), code:c.code, name:c.name, description:c.description||'', active:!!c.active, sort:parseInt(c.code)||99});
      }
      dlog('categories.save', c.code+' '+c.name); saveDB(db);
      return {success:true};
    }
    case 'categories.delete': {
      const i=db.cats.findIndex(x=>x.id===data.id);
      if(i<0) return {success:false,message:'ไม่พบหมวดหมู่นี้'};
      if(db.docs.some(d=>d.categoryId===data.id && d.status!=='deleted')) return {success:false,message:'มีเอกสารใช้หมวดหมู่นี้อยู่ กรุณาปิดการใช้งานแทนการลบ'};
      db.cats.splice(i,1); dlog('categories.delete', data.id); saveDB(db);
      return {success:true};
    }
    case 'users.list': return {success:true, users:db.users.map(pubU)};
    case 'users.save': {
      const u=data.user||{};
      const email=String(u.email||'').trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return {success:false,message:'รูปแบบอีเมลไม่ถูกต้อง'};
      let perms = typeof u.permissions==='string'? u.permissions : JSON.stringify(u.permissions||{});
      if(u.id){
        const i=db.users.findIndex(x=>x.id===u.id);
        if(i<0) return {success:false,message:'ไม่พบผู้ใช้งานนี้'};
        if(db.users.some((x,j)=>j!==i&&x.email===email)) return {success:false,message:'อีเมลนี้ถูกใช้งานโดยบัญชีอื่นแล้ว'};
        db.users[i]={...db.users[i], email, name:u.name||'', position:u.position||'', role:u.role==='admin'?'admin':'user', permissions:perms, status:u.status==='inactive'?'inactive':'active'};
        if(u.password) db.users[i].pass=String(u.password);
      } else {
        if(!u.password||String(u.password).length<6) return {success:false,message:'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'};
        if(db.users.some(x=>x.email===email)) return {success:false,message:'อีเมลนี้ถูกใช้งานแล้ว'};
        db.users.push({id:'U'+String(db.users.length+1).padStart(4,'0'), email, pass:String(u.password), name:u.name||'', position:u.position||'', role:u.role==='admin'?'admin':'user', permissions:perms, status:u.status==='inactive'?'inactive':'active', lastLogin:''});
      }
      dlog('users.save', email); saveDB(db);
      return {success:true};
    }
    case 'users.delete': {
      const cur=demoUser(db);
      const i=db.users.findIndex(x=>x.id===data.id);
      if(i<0) return {success:false,message:'ไม่พบผู้ใช้งานนี้'};
      if(db.users[i].email===cur.email) return {success:false,message:'ไม่สามารถลบบัญชีของตัวเองได้'};
      db.users.splice(i,1); dlog('users.delete', data.id); saveDB(db);
      return {success:true};
    }
    case 'files.upload': {
      dlog('files.upload', data.fileName||'ไฟล์'); saveDB(db);
      return {success:true, file:{id:'demo'+Date.now(), name:data.fileName||'file', url:'#'}};
    }
    case 'logs.list': return {success:true, logs:db.logs.slice(0,300)};
    default: return {success:false, message:'ไม่พบ action: '+action};
  }
}

function filteredDocs(){
  const f=S.filters;
  return S.docs.filter(d=>{
    if(d.status==='deleted') return false;
    if(f.type && d.type!==f.type) return false;
    if(f.cat && d.categoryId!==f.cat) return false;
    if(f.from && String(d.date||'')<f.from) return false;
    if(f.to && String(d.date||'')>f.to) return false;
    if(f.q){ const q=f.q.toLowerCase();
      return [d.number,d.title,d.content,d.refNumber,d.fromParty,d.toParty].some(x=>String(x||'').toLowerCase().includes(q)); }
    return true;
  }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}

async function docFormSubmit(e){
  e.preventDefault();
  const id=$('#df-id').value;
  const doc={
    id:id||'', type:$('#df-type').value, date:$('#df-date').value,
    number:$('#df-number').value.trim(), refNumber:$('#df-ref').value.trim(),
    title:$('#df-title').value.trim(), categoryId:$('#df-cat').value,
    urgency:$('#df-urg').value, classification:$('#df-cls').value,
    fromParty:$('#df-from').value.trim(), toParty:$('#df-to').value.trim(),
    content:$('#df-content').value, signer:$('#df-signer').value.trim(),
    signerPosition:$('#df-pos').value.trim(), remark:$('#df-remark').value.trim(),
  };
  if(!doc.title){ toast('กรุณาระบุเรื่อง','error'); return; }
  if(pendingFile){
    toast('กำลังอัปโหลดไฟล์...','info');
    let out;
    if(DEMO){ out={success:true,file:{id:'demo',name:pendingFile.name,url:'#'}}; }
    else{
      const b64=await fileToBase64(pendingFile);
      out=await api('files.upload',{fileName:pendingFile.name, mimeType:pendingFile.type, base64:b64});
    }
    if(out.success){ doc.fileId=out.file.id; doc.fileName=out.file.name; doc.fileUrl=out.file.url; }
    else{ toast(out.message,'error'); return; }
  } else if(id){
    const old=S.docs.find(x=>x.id===id);
    if(old){ doc.fileId=old.fileId; doc.fileName=old.fileName; doc.fileUrl=old.fileUrl; }
  }
  const out=await api('documents.save',{doc});
  if(out.success){
    toast((id?'แก้ไข':'สร้าง')+'เอกสารสำเร็จ — เลขที่ '+out.number);
    closeModal(); await reloadDocs();
    go('docview', out.id);
  } else toast(out.message,'error');
}

async function userFormSubmit(e){
  e.preventDefault();
  const p={};
  document.querySelectorAll('[data-perm]').forEach(cb=>{

  });
  const user={ id:$('#uf-id').value, email:$('#uf-email').value.trim(), name:$('#uf-name').value.trim(),
    position:$('#uf-position').value.trim(), role:$('#uf-role').value, status:$('#uf-status').value,
    permissions:p, password:$('#uf-pass').value };
  if(!user.id && String(user.password||'').length<6) return toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร','error');
  const out=await api('users.save',{user});
  if(out.success){ toast('บันทึกผู้ใช้งานแล้ว'); closeModal(); loadUsers(); }
  else toast(out.message,'error');
}

  const out=await api('users.delete',{id});
  if(out.success){ toast('ลบผู้ใช้แล้ว'); loadUsers(); } else toast(out.message,'error');
}

    <div class="bg-white rounded-xl border p-5">
      <h3 class="font-bold text-slate-800 mb-4">เปลี่ยนรหัสผ่าน</h3>
      <form onsubmit="changePassSubmit(event)" class="space-y-3">
        <div><label class="${LBL}">รหัสผ่านปัจจุบัน</label><input id="cp-old" type="password" class="${INP}" required></div>
        <div><label class="${LBL}">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label><input id="cp-new" type="password" class="${INP}" required minlength="6"></div>
        <div><label class="${LBL}">ยืนยันรหัสผ่านใหม่</label><input id="cp-new2" type="password" class="${INP}" required></div>
        <button type="submit" class="${BTN_P}">เปลี่ยนรหัสผ่าน</button>
      </form>
    </div>
  </div>`;
}
async function changePassSubmit(e){
  e.preventDefault();
  if($('#cp-new').value!==$('#cp-new2').value) return toast('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน','error');
  const out=await api('changePassword',{oldPassword:$('#cp-old').value, newPassword:$('#cp-new').value});
  if(out.success){ toast(out.message||'เปลี่ยนรหัสผ่านสำเร็จ'); e.target.reset(); }
  else toast(out.message,'error');
}
